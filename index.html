<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>A-Frame Scene</title>
    <script src="https://aframe.io"></script>
    
    <style>
        /* Полностью сохраненный ваш оригинальный контейнер */
        .container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0);
            color: black;
            padding-left: 1px;
            padding-right: 1px;
            font-size: 16px;
            z-index: 999; /* Гарантируем, что кнопки кликаются */
        }
        
        /* Полностью сохраненный ваш оригинальный стиль кнопок */
        .btn {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid #8b95e7;
            border-radius: 2px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            width: 100px; /* Фиксированная ширина, чтобы кнопки не сжимались */
            opacity: 0.9;
            font-size: 16px;
            display: inline-block; /* Выстраивает кнопки в один ряд */
            margin-right: 5px;     /* Отступ между кнопками */
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Ваша оригинальная сцена без изменений, вызывавших белый экран -->
    <a-scene>
        <a-assets>
            <audio id="bg-music" src="music.mp3" preload="auto" loop></audio>
        </a-assets>
        <a-sky src="1.jpg"></a-sky>
    </a-scene>

    <!-- Исправленный контейнер: формы убраны, чтобы элементы не прыгали -->
    <div class="container">
        
        <!-- Новая кнопка для Музыки (в вашем стиле) -->
        <button type="button" class="btn" id="musicBtn">MUSIC</button>
        
        <!-- Ваша кнопка NEXT (переход по клику через JS, чтобы не ломать верстку тегом form) -->
        <button type="button" class="btn" onclick="window.location.href='1'">NEXT</button>

    </div>

    <!-- Скрипт, который обходит блокировку звука на iOS (iPhone) и Android -->
    <script>
        const musicBtn = document.getElementById('musicBtn');
        const audio = document.getElementById('bg-music');
        let isPlaying = false;

        musicBtn.addEventListener('click', function() {
            if (!isPlaying) {
                // Нативный запуск аудио + обход ограничений мобильных браузеров
                audio.play()
                    .then(() => {
                        musicBtn.textContent = "PAUSE";
                        musicBtn.style.backgroundColor = "rgba(139, 149, 231, 0.4)"; // Подсветка при игре
                        isPlaying = true;
                    })
                    .catch(error => {
                        console.log("Ошибка воспроизведения:", error);
                    });
            } else {
                audio.pause();
                musicBtn.textContent = "MUSIC";
                musicBtn.style.backgroundColor = "rgba(0, 0, 0, 0.2)";
                isPlaying = false;
            }
        });
    </script>

</body>
</html>
