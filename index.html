<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io"></script>
    <style>
        .container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0);
            color: black;
            padding-left: 1px;
            padding-right: 1px;
            font-size: 16px;
            z-index: 9999;
        }
        .btn {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid #8b95e7;
            border-radius: 2px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            width: 100%;
            opacity: 0.9;
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Чистая сцена A-Frame, которая больше никогда не слетит при зацикливании -->
    <a-scene>
        <a-sky src="1.jpg"></a-sky>
    </a-scene>

    <!-- Изолированный нативный HTML5 звук, который мы контролируем на 100% -->
    <audio id="bg-audio" src="music.mp3" preload="auto" loop></audio>

    <div class="container">
        <form id="sceneForm" action="1">
            <!-- Кнопка Музыки теперь умеет И включать, И выключать (PLAY/PAUSE) -->
            <button type="button" class="btn" id="musicBtn" onclick="toggleMusic()">MUSIC: OFF</button>
            
            <!-- Кнопка NEXT с гарантированной очисткой звука -->
            <button type="button" class="btn" onclick="nextScene()">NEXT</button>
        </form>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        const musicBtn = document.getElementById('musicBtn');

        // Функция ВКЛЮЧЕНИЯ / ВЫКЛЮЧЕНИЯ музыки на одной сцене
        function toggleMusic() {
            // Обход блокировки звука на iOS/Android
            const scene = document.querySelector('a-scene');
            if (scene && scene.audioListener && scene.audioListener.context.state === 'suspended') {
                scene.audioListener.context.resume();
            }

            if (audio.paused) {
                audio.play();
                musicBtn.textContent = "MUSIC: ON";
                musicBtn.style.backgroundColor = "rgba(139, 149, 231, 0.4)"; // визуальный отклик
            } else {
                audio.pause();
                musicBtn.textContent = "MUSIC: OFF";
                musicBtn.style.backgroundColor = "rgba(0,0,0,0.2)";
            }
        }

        // Функция безопасного перехода на следующую сцену
        function nextScene() {
            // 1. Полностью останавливаем музыку
            audio.pause();
            audio.currentTime = 0; // Сбрасываем дорожку в начало
            
            // 2. Убиваем объект аудио в памяти браузера, чтобы при быстром клике треки не накладывались
            audio.src = ""; 
            audio.load(); 

            // 3. Мгновенно отправляем форму
            document.getElementById('sceneForm').submit();
        }
    </script>

</body>
</html>
