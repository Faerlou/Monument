<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io"></script>
    <style>
        .container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0);
            color: black;
            padding-left: 1px;
            padding-right: 1px;
            font-size: 16px;
            z-index: 9999;
        }
        .btn {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid #8b95e7;
            border-radius: 2px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            width: 100%;
            opacity: 0.9;
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Добавлено событие stopMusic для принудительной остановки звука -->
    <a-scene sound="src: url(music.mp3); autoplay: false; loop: true; on: playMusic; off: stopMusic;">
        <a-sky src="1.jpg"></a-sky>
    </a-scene>

    <div class="container">
        <!-- Оригинальная форма перехода -->
        <form id="sceneForm" action="1">
            <!-- Кнопка Музыки (без изменений) -->
            <button type="button" class="btn" onclick="document.querySelector('a-scene').emit('playMusic')">MUSIC</button>
            
            <!-- Исправленная кнопка NEXT с вызовом функции остановки -->
            <button type="button" class="btn" onclick="handleNextScene()">NEXT</button>
        </form>
    </div>

    <script>
        function handleNextScene() {
            const scene = document.querySelector('a-scene');
            
            if (scene && scene.components && scene.components.sound) {
                // Отправляем событие 'stopMusic' (останавливает аудио внутри A-Frame)
                scene.emit('stopMusic');
                
                // Дополнительно принудительно выключаем звук через аудио-движок
                scene.components.sound.stopSound();
            }

            // Небольшая микро-задержка (50 миллисекунд), чтобы телефон успел применить команду 
            // и плавно перенаправил пользователя на страницу "1" без хрипов звука
            setTimeout(() => {
                document.getElementById('sceneForm').submit();
            }, 50);
        }
    </script>

</body>
</html>

</body>
</html>
