<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>A-Frame Scene</title>
    <script src="https://aframe.io"></script>
    
    <style>
        /* ВАШ ОРИГИНАЛЬНЫЙ КОНТЕЙНЕР (БЕЗ ИЗМЕНЕНИЙ) */
        .container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0);
            color: black;
            padding-left: 1px;
            padding-right: 1px;
            font-size: 16px;
            z-index: 9999; /* Чтобы сцена точно не перекрывала кнопки */
        }
        
        /* ВАШ ОРИГИНАЛЬНЫЙ СТИЛЬ КНОПОК */
        .btn {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid #8b95e7;
            border-radius: 2px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            opacity: 0.9;
            font-size: 16px;
            
            /* Эти две строчки аккуратно ставят кнопки в ряд, не сжимая их размер */
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <!-- ВАША ОРИГИНАЛЬНАЯ РАБОЧАЯ СЦЕНА (БЕЗ ИЗМЕНЕНИЙ) -->
    <a-scene>
        <a-sky src="1.jpg"></a-sky>
    </a-scene>

    <!-- Изолированный плеер, вынесенный за пределы 3D-сцены -->
    <audio id="mobileMusic" src="music.mp3" preload="auto" loop></audio>

    <!-- ИНТЕРФЕЙС ПОВЕРХ СЦЕНЫ -->
    <div class="container">
        
        <!-- Новая кнопка Музыки в вашем стиле -->
        <button type="button" class="btn" onclick="togglePlay()">MUSIC</button>
        
        <!-- Ваша оригинальная кнопка NEXT -->
        <form action="1" style="display: inline-block; margin: 0;">
            <button class="btn">NEXT</button>
        </form>

    </div>

    <!-- Простейший скрипт: 100% совместимость с iPhone и Android -->
    <script>
        var audio = document.getElementById('mobileMusic');
        
        function togglePlay() {
            // На мобильных устройствах звук обязан запускаться внутри функции клика
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    </script>

</body>
</html>
