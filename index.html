<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0);
            color: black;
            padding-left: 1px;
            padding-right: 1px;
            font-size: 16px;
            z-index: 9999;
        }
        .btn {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid #8b95e7;
            border-radius: 2px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            width: 100%;
            opacity: 0.9;
            font-size: 16px;
            margin-bottom: 5px; /* Чтобы кнопки не слипались по вертикали */
        }
    </style>
</head>
<body>

    <!-- Встроенная аудиосистема A-Frame (без внешних JS-скриптов) -->
    <a-scene sound="src: url(music.mp3); autoplay: false; loop: true; on: playMusic;">
        <a-sky src="1.jpg"></a-sky>
    </a-scene>

    <!-- Ваша оригинальная структура формы (добавлена только кнопка MUSIC) -->
    <div class="container">
        <form action="1">
            <!-- Кнопка Музыки: отправляет событие 'playMusic' прямо в сцену A-Frame -->
            <button type="button" class="btn" onclick="document.querySelector('a-scene').emit('playMusic')">MUSIC</button>
            
            <!-- Ваша оригинальная кнопка NEXT -->
            <button class="btn">NEXT</button>
        </form>
    </div>

</body>
</html>

</body>
</html>
